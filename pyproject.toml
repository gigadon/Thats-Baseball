[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thats-baseball"
version = "0.1.0"
description = "MLB prediction and betting system"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "redis>=5.0,<6.0",
    # Model-critical libraries are PINNED: the committed model artifacts
    # (models/win_model, models/runs_model) are pickles created with these
    # exact versions and must load identically in CI (GitHub Actions daily
    # job). Bump these only together with a model retrain. pyarrow is in this
    # block because data/training_data.parquet is the training set: without it
    # build_training_data dies on to_parquet and the weekly retrain never gets
    # as far as training anything (it did exactly that, silently, for 3 weeks).
    "numpy==2.2.0",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "xgboost==2.1.3",
    "lightgbm==4.6.0",
    "catboost==1.2.10",
    "joblib==1.4.2",
    "pyarrow==24.0.0",
    # scipy is pinned for the same reason, one step removed: sklearn estimators
    # can carry scipy objects inside their fitted state (IsotonicRegression holds
    # a scipy.interpolate.interp1d, for one). Nothing in the current ensemble does
    # — the calibrator is PlattCalibrator over a LogisticRegression — but that is a
    # property of today's model shape, not a guarantee, and a range here means CI
    # resolves a different scipy than the machine that authored the pickles.
    "scipy==1.17.1",
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "jinja2>=3.1,<4.0",
    "optuna>=3.5,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
