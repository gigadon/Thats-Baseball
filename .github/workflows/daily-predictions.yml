name: Daily MLB Predictions to Slack

# Replaces the dead Railway scheduler: runs the daily pipeline with the model
# committed in THIS repo, posts predictions to Slack, settles/scores yesterday,
# and commits the accumulated data back so retraining data keeps growing.
on:
  schedule:
    # The 16:30 UTC run is the MAIN card: yesterday's review (full slate, high-conf,
    # betting card), today's full slate, and the day's entire betting card. It also
    # locks data/slates/{date}.json — the slate of record that settlement and
    # accuracy grade. The later runs are wave reminders: the games starting within
    # the next ~4h that haven't been sent yet, with fresh starters/lineups and NO
    # bets (see mlb.etl.slate_record). Times are UTC; EDT/CDT (summer) shown. In
    # winter they land 1h earlier — accepted DST drift.
    #   16:30 UTC = 12:30 PM EDT / 11:30 AM CDT — main card (review + slate + bets)
    - cron: "30 16 * * *"
    #   19:30 UTC = 3:30 PM EDT / 2:30 PM CDT — afternoon wave
    - cron: "30 19 * * *"
    #   22:30 UTC = 6:30 PM EDT / 5:30 PM CDT — early-evening wave
    - cron: "30 22 * * *"
    #   00:30 UTC = 8:30 PM EDT / 7:30 PM CDT — late/West-coast wave
    - cron: "30 0 * * *"
  workflow_dispatch: {}   # manual test runs from the Actions tab (sends full slate)

permissions:
  contents: write   # the data commit-back step pushes to main

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Backfill recent game results (rolling team stats source)
        # Once/day work — only on the morning cron (and manual runs). Later waves
        # reuse the data the morning run committed, saving time and API quota.
        if: github.event.schedule == '30 16 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true   # a backfill hiccup must not block predictions
        env:
          PYTHONPATH: src
        # 10-day window, merge-by-game_id semantics: keeps games/batting/pitching
        # CSVs current so Elo/form/venue features aren't stale (the old Railway
        # scheduler did this daily; it died with the trial).
        run: |
          python -m mlb.etl.backfill \
            --start "$(date -u -d '10 days ago' +%F)" \
            --end "$(date -u +%F)" \
            --delay 0.3

      # Grading runs on EVERY cron, over a two-week window. Both steps are
      # continue-on-error, and they used to run only on the morning cron with a
      # 2-day window — so one failed morning meant that day was never graded
      # again (2026-07-10, 07-13..07-15, 07-22, 07-23 were lost that way). A wide
      # window on every run means any later run repairs the gap. Re-grading is
      # cheap and idempotent: settlement skips days it already settled, and
      # accuracy keeps the existing record unless the new grade ranks higher
      # (mlb.models.accuracy._grade_quality). Scores come from the free MLB API
      # first now, so this costs no Odds API quota.
      - name: Settle recent bets
        continue-on-error: true   # missing scores must not block today's slate
        env:
          PYTHONPATH: src
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m mlb.betting.settlement --backfill 14

      - name: Score recent predictions
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m mlb.models.accuracy --backfill 14

      - name: Run daily predictions (posts to Slack)
        env:
          PYTHONPATH: src
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        # Main cron = preview (review + full slate + the whole betting card, and it
        # locks data/slates). Every other cron = wave (only games starting within the
        # next 4h, de-duped via data/sent, no bets). Manual dispatch = full slate.
        run: |
          if [ "${{ github.event.schedule }}" = "30 16 * * *" ]; then
            python -m mlb.etl.daily_runner --send-mode preview --lead-hours 4
          elif [ -n "${{ github.event.schedule }}" ]; then
            python -m mlb.etl.daily_runner --send-mode wave --lead-hours 4
          else
            python -m mlb.etl.daily_runner --send-mode full
          fi

      - name: Commit accumulated data back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds_history.csv data/accuracy data/predictions data/betting data/sent data/slates data/feature_defaults.json \
                  data/games_*.csv data/batting_*.csv data/pitching_*.csv || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily data update ($(date -u +%F))"
            git pull --rebase origin main
            git push origin main
          fi
